services:
  # Node.js Backend Service
  - type: web
    name: acadex-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 2 # Scale to 2 workers inside the instance (adjust based on plan RAM)
      - key: PYTHON_SERVICE_URL
        fromService:
          type: web
          name: acadex-python-service
          property: url
      
  # Python Service
  - type: web
    name: acadex-python-service
    env: python
    plan: starter
    rootDir: python-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
