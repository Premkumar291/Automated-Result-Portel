version: '3.8'

services:
  python-service:
    build: ./python-service
    container_name: acadex-python-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - acadex-network

  backend:
    build: ./backend
    container_name: acadex-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PYTHON_SERVICE_URL=http://python-service:8000
    depends_on:
      python-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - acadex-network

  frontend:
    build: ./frontend
    container_name: acadex-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: always
    networks:
      - acadex-network

networks:
  acadex-network:
    driver: bridge
